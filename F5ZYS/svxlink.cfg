[GLOBAL]
LOGICS=RepeaterLogic,ReflectorLogic
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT=%c
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1
LINKS=ALLlink
LOCATION_INFO=LocationInfo

[RepeaterLogic]
TYPE=Repeater
RX=Rx1
TX=Tx1
MODULES=ModuleHelp,ModulePropagationMonitor
CALLSIGN=F5ZYS
SHORT_IDENT_INTERVAL=0
LONG_IDENT_INTERVAL=60
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=fr_FR
RGR_SOUND_DELAY=0
MACROS=Macros
FX_GAIN_NORMAL=0
FX_GAIN_LOW=-12
REPORT_CTCSS=118.8
OPEN_ON_CTCSS=118.8:500
#OPEN_ON_SQL=1
IDLE_TIMEOUT=10

[ALLlink]
CONNECT_LOGICS=RepeaterLogic:434MHZ:945,ReflectorLogic
DEFAULT_ACTIVE=1
TIMEOUT=0

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
HID_DEVICE=/dev/hidraw0
HID_SQL_PIN=VOL_DN
SQL_DET=HIDRAW
SQL_START_DELAY=500
SQL_DELAY=10
SQL_HANGTIME=5
SQL_EXTENDED_HANGTIME=1000
SQL_EXTENDED_HANGTIME_THRESH=13
SQL_TIMEOUT=0
VOX_FILTER_DEPTH=300
VOX_THRESH=1000
CTCSS_MODE=2
CTCSS_FQ=118.8
CTCSS_SNR_OFFSET=0
CTCSS_OPEN_THRESH=15
CTCSS_CLOSE_THRESH=9
CTCSS_BPF_LOW=60
CTCSS_BPF_HIGH=260
GPIO_PATH=/sys/class/gpio
GPIO_SQL_PIN=gpio23
DEEMPHASIS=0
SQL_TAIL_ELIM=200
PREAMP=0
PEAK_METER=0
DTMF_DEC_TYPE=INTERNAL
DTMF_MUTING=1
DTMF_HANGTIME=40
1750_MUTING=1

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
PTT_TYPE=Hidraw
HID_DEVICE=/dev/hidraw0
PTT_PIN=gpio17
GPIO_PATH=/sys/class/gpio
HID_PTT_PIN=GPIO3
TIMEOUT=0
TX_DELAY=750
PREAMP=0
CTCSS_FQ=118.8
CTCSS_LEVEL=9
DTMF_TONE_LENGTH=100
DTMF_TONE_SPACING=50
DTMF_DIGIT_PWR=-15

[LocationInfo]
APRS_SERVER_LIST=euro.aprs2.net:14580
LON_POSITION=42.45.33W
LAT_POSITION=77.59.52N
CALLSIGN=EL-F5ZYS
FREQUENCY=432.975
TX_POWER=3
ANTENNA_GAIN=1
ANTENNA_HEIGHT=4m
ANTENNA_DIR=-1
PATH=WIDE1-1
BEACON_INTERVAL=10
TONE=71
COMMENT=>>> µUsbPlug V1.0 <<<<<

[ReflectorLogic]
TYPE=Reflector
CALLSIGN=(88) F5ZYS R
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=2

